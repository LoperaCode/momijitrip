<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japón Momiji 2.0 | Cuaderno de Ruta</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="momiji-container" id="momijiContainer"></div>

    <header class="site-header">
        <div class="header-content">
            <h1>Ruta Momiji 2028</h1>
            <p>20 días de ruta en coche • De Nagasaki a Kioto y regreso por el Norte</p>
        </div>
        <div class="header-actions">
            <a class="btn-top-action" href="index.html">Volver al itinerario</a>
            <a class="btn-top-action" href="dashboard.html">📒 Mi cuaderno</a>
            <button id="toggleMomiji" class="btn-top-action" aria-label="Activar o pausar la lluvia de hojas">🍁</button>
        </div>
    </header>

    <main class="container destination-container">
        <article class="destination-card" id="destinationDetails" aria-live="polite">
            <p>Buscando el destino...</p>
        </article>
        <section class="destination-notes" id="destinationNotes" hidden>
            <p class="dashboard-eyebrow">TU CUADERNO</p>
            <h2>Mis notas para este día</h2>
            <p class="destination-note-help">Guarda ideas, reservas o recuerdos de este destino.</p>
            <p id="destinationNoteMessage" class="destination-note-message" aria-live="polite"></p>
            <div id="destinationNoteEditor" hidden>
                <label for="destinationNote">Tu nota</label>
                <textarea id="destinationNote" rows="5" placeholder="Escribe aquí tu nota..."></textarea>
                <div class="destination-note-actions">
                    <button class="btn-submit" id="saveDestinationNote" type="button">Guardar nota</button>
                    <button class="btn-note-delete" id="deleteDestinationNote" type="button">Borrar nota</button>
                </div>
                <p class="destination-note-status" id="destinationNoteStatus" aria-live="polite"></p>
            </div>
        </section>
        <!-- Sustituye cada div por <img class="destination-photo-placeholder" src="images/foto.jpg" alt="Descripción del lugar"> cuando añadas las fotos. -->
        <section class="destination-gallery" aria-label="Fotos del destino">
            <figure>
                <div class="destination-photo-placeholder">Hueco para la foto 1</div>
                <figcaption>Foto 1 del destino</figcaption>
            </figure>
            <figure>
                <div class="destination-photo-placeholder">Hueco para la foto 2</div>
                <figcaption>Foto 2 del destino</figcaption>
            </figure>
        </section>
    </main>

    <footer class="site-footer">
        <p>Hecho con 💚 por <a href="https://github.com/LoperaCode">LoperaCode</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
